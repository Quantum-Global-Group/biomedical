app = "hetqml-web"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"
  # NEXT_PUBLIC_* must be baked at build time — not provided via [env].
  # Override with: fly deploy --build-arg NEXT_PUBLIC_API_URL=https://...
  [build.args]
    NEXT_PUBLIC_API_URL = "https://hetqml-api.fly.dev"

[env]
  NODE_ENV = "production"
  PORT = "3000"
  # Server-side fetches (RSC, Route Handlers) use Fly 6PN private networking.
  API_INTERNAL_URL = "http://hetqml-api.internal:8000"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "15s"
    interval = "30s"
    method = "get"
    path = "/initialize"
    protocol = "http"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  # Next 16 standalone + React 19 + sharp need headroom; 512mb risks OOM
  # on cold-starts when the catalog hydration RSC runs.
  memory = "1gb"
