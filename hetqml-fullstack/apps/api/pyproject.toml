[project]
name = "hetqml-api"
version = "0.1.0"
description = "FastAPI service for hetqml-fullstack: model runs, validation metrics, IBM Quantum job status."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "httpx>=0.27.0",
    # ML + quantum stack used by the algorithm dispatcher in jobs/runner.py.
    # numpy + scikit-learn drive the classical baseline + hybrid SVM head.
    # qiskit + qiskit-aer compute a local ZZ-feature-map kernel matrix.
    # qiskit-ibm-runtime is opt-in: only invoked when the user has both
    # ibmConnection.apiToken and ibmConnection.crn set in /settings.
    "numpy>=2.0.0",
    "scikit-learn>=1.5.0",
    "qiskit>=1.2.0",
    "qiskit-aer>=0.15.0",
    "qiskit-ibm-runtime>=0.30.0",
    # Optional: real UMAP embedding for candidate scatter. Graceful fallback
    # to hash-based positions when not installed.
    "umap-learn>=0.5",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hetqml_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
