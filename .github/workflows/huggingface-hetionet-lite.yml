# Builds the linked-lite static export (Fly API) and pushes hetqml-fullstack/apps/web/hf_space
# to Hugging Face so Docker Space rebuilds — static/ is gitignored here and must never be omitted.
#
# Requires repository secret HF_TOKEN with write access to the target Space.
# Optional: set repository variable HF_SPACE_REPO_ID (default quantumGlobalGroup/Hetionet-Lite).

name: Hugging Face · Hetionet Lite Space

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "hetqml-fullstack/apps/web/**"
      - "scripts/sync_hf_space_lite.py"
      - ".github/workflows/huggingface-hetionet-lite.yml"

concurrency:
  group: huggingface-hetionet-lite
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      HF_SPACE_REPO_ID: ${{ vars.HF_SPACE_REPO_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: hetqml-fullstack/pnpm-lock.yaml

      - name: Install & export (linked Fly bundle)
        working-directory: hetqml-fullstack
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter hetqml-web export:hf

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Upload Space folder to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          pip install --quiet huggingface_hub
          python3 scripts/sync_hf_space_lite.py
